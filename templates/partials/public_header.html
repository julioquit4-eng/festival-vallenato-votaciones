<header class="site-header">
  <nav class="navbar navbar-expand-lg" aria-label="Navegación principal">
    <div class="container">
      <a class="vf-brand" href="{% url 'public:inicio' %}" aria-label="Festival Vallenato · Votaciones 2027, ir al inicio">
        <span class="vf-brand__mark" aria-hidden="true"><i class="bi bi-music-note-beamed"></i></span>
        <span class="vf-brand__text">
          <span class="vf-brand__name">Festival Vallenato</span>
          <span class="vf-brand__sub">Votaciones · 2027</span>
        </span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Abrir menú de navegación">
        <i class="bi bi-list fs-4" aria-hidden="true"></i>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav mx-auto gap-lg-1">
          <li class="nav-item"><a class="nav-link" data-nav="inicio" href="{% url 'public:inicio' %}">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" data-nav="votaciones" href="{% url 'public:votaciones' %}">Votaciones</a></li>
          <li class="nav-item"><a class="nav-link" data-nav="resultados" href="{% url 'public:resultados' %}">Resultados</a></li>
          <li class="nav-item"><a class="nav-link" data-nav="guia" href="{% url 'public:guia' %}">Guía de participación</a></li>
        </ul>
        <div class="d-flex flex-column flex-lg-row align-items-lg-center gap-2 mt-3 mt-lg-0">
          {% if request.user.is_staff %}
            <a class="btn btn-vf-outline btn-sm" href="{% url 'panel:dashboard' %}">
              <i class="bi bi-speedometer2" aria-hidden="true"></i>Panel administrativo
            </a>
            <form method="post" action="{% url 'public:cerrar_sesion' %}">
              {% csrf_token %}
              <button type="submit" class="btn btn-vf btn-sm">
                <i class="bi bi-box-arrow-right" aria-hidden="true"></i>Cerrar sesión
              </button>
            </form>
          {% else %}
            <a class="btn btn-vf-outline btn-sm" id="headerBtnLogin" href="{% url 'public:login' %}">
              <i class="bi bi-person-circle" aria-hidden="true"></i>Acceso administrativo
            </a>
            <a class="btn btn-vf btn-sm" id="headerCtaVotar" href="{% url 'public:votaciones' %}">
              <i class="bi bi-list-check" aria-hidden="true"></i>Consultar votaciones
            </a>
          {% endif %}
        </div>
      </div>
    </div>
  </nav>
</header>
